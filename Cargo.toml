[package]
name = "alaska"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A simple, fast terminal music player for local files and OpenSubsonic servers"
repository = "https://github.com/alpwrk/alaska"
readme = "README.md"
license = "MIT"
keywords = ["music", "tui", "audio", "subsonic", "player"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
libc = "0.2.191"
lofty = "0.25.5"
md-5 = "0.11"
ogg = "0.9.2"
opus = "0.4.0"
rand = "0.10.4"
ratatui = "0.30.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
toml = "1"
unicode-width = "0.2"
ureq = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
